name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch prebuilt libs & headers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/official_apk deps/out/arm64-v8a/sdl3/lib deps/out/arm64-v8a/sdl3/include deps/out/arm64-v8a/ffmpeg/lib deps/out/arm64-v8a/shaderc/lib deps/out/arm64-v8a/shaderc/include android/app/src/main/jniLibs/arm64-v8a
          gh release download --repo khorne-hub/gu-native --pattern "*.apk" --dir /tmp/official_apk/
          unzip -q /tmp/official_apk/*.apk "lib/arm64-v8a/*" -d /tmp/official_apk/
          cp /tmp/official_apk/lib/arm64-v8a/libSDL3.so deps/out/arm64-v8a/sdl3/lib/
          cp /tmp/official_apk/lib/arm64-v8a/libmhguffmpeg.so deps/out/arm64-v8a/ffmpeg/lib/
          cp /tmp/official_apk/lib/arm64-v8a/*.so android/app/src/main/jniLibs/arm64-v8a/
          git clone --depth 1 --branch release-3.2.8 https://github.com /tmp/sdl3_src
          cp -r /tmp/sdl3_src/include/SDL3 deps/out/arm64-v8a/sdl3/include/
          /usr/local/lib/android/sdk/ndk/27.0.12077973/ndk-build NDK_PROJECT_PATH=/tmp/shaderc APP_BUILD_SCRIPT=/usr/local/lib/android/sdk/ndk/27.0.12077973/sources/third_party/shaderc/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 APP_STL=c++_shared libshaderc_combined -j4
          cp /tmp/shaderc/obj/local/arm64-v8a/libshaderc_combined.a deps/out/arm64-v8a/shaderc/lib/
          cp -r /usr/local/lib/android/sdk/ndk/27.0.12077973/sources/third_party/shaderc/include/* deps/out/arm64-v8a/shaderc/include/

      - name: Build Native Libraries (libmain.so with texture edit)
        run: |
          chmod +x native/build_native.sh
          ./native/build_native.sh arm64-v8a

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gu-native-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
