name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Linux shims for Windows scripts
        run: |
          printf '#!/bin/bash\nfor a in "$@"; do [[ "$a" != -* ]] && echo "$a"; done\n' | sudo tee /usr/local/bin/cygpath > /dev/null
          sudo chmod +x /usr/local/bin/cygpath
          ln -sf /usr/local/lib/android/sdk/cmake/3.22.1/bin/cmake /usr/local/lib/android/sdk/cmake/3.22.1/bin/cmake.exe
          ln -sf /usr/local/lib/android/sdk/cmake/3.22.1/bin/ninja /usr/local/lib/android/sdk/cmake/3.22.1/bin/ninja.exe

      - name: Build Dependencies (SDL3, shaderc, FFmpeg)
        env:
          LOCALAPPDATA: /usr/local/lib/android
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p /usr/local/lib/android/Android
          ln -sfn /usr/local/lib/android/sdk /usr/local/lib/android/Android/Sdk
          chmod +x deps/build_deps.sh deps/build_ffmpeg.sh
          ./deps/build_deps.sh arm64-v8a
          ./deps/build_ffmpeg.sh arm64-v8a

      - name: Build Native Libraries (.so)
        run: |
          chmod +x native/build_native.sh
          ./native/build_native.sh arm64-v8a

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gu-native-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
