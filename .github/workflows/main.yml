name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch prebuilt libs (SDL3 & FFmpeg) from official release
        run: |
          mkdir -p /tmp/official_apk deps/out/arm64-v8a/sdl3/lib deps/out/arm64-v8a/ffmpeg/lib android/app/src/main/jniLibs/arm64-v8a
          APK_URL=$(curl -s https://github.com | grep "browser_download_url.*\.apk" | head -n 1 | cut -d '"' -f 4)
          curl -L "$APK_URL" -o /tmp/official_apk/official.apk
          unzip -q /tmp/official_apk/official.apk "lib/arm64-v8a/*" -d /tmp/official_apk/
          cp /tmp/official_apk/lib/arm64-v8a/libSDL3.so deps/out/arm64-v8a/sdl3/lib/
          cp /tmp/official_apk/lib/arm64-v8a/libmhguffmpeg.so deps/out/arm64-v8a/ffmpeg/lib/
          cp /tmp/official_apk/lib/arm64-v8a/*.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Native Libraries (libmain.so with texture edit)
        run: |
          chmod +x native/build_native.sh
          ./native/build_native.sh arm64-v8a

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gu-native-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
